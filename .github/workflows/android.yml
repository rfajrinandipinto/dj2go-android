name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dj2go-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DJ2GO_KEYSTORE: release.jks
          DJ2GO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DJ2GO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DJ2GO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ls -R app/build/outputs/apk/release
          cp app/build/outputs/apk/release/app-release.apk "dj2go-${GITHUB_REF_NAME}.apk"
          ls -l dj2go-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dj2go-*.apk
          fail_on_unmatched_files: true
